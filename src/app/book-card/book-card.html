<a
  class="book-card-link"
  [routerLink]="['/stacks/book', id]"
>

  <article class="book-card">

    <div
      class="book-cover"
      [class]="coverClass">

      <img
        [src]="bookImage"
        [alt]="title"
      >

    </div>

    <div class="book-info">

      <div class="tags">

        @for (tag of tags; track tag) {

          <span>
            {{ tag }}
          </span>

        }

      </div>

      <h3>
        {{ title }}
      </h3>

      <p class="author">
        by {{ author }}
      </p>

      <p class="reading-time">
        · {{ readingTime }}
      </p>

    </div>

  </article>

</a>
